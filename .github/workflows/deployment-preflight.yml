name: Deployment preflight

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to inspect without creating a release
        required: true
        type: choice
        options:
          - development
          - production
      mode:
        description: Inspect the legacy baseline or enforce every public-cutover prerequisite
        required: true
        default: cutover-ready
        type: choice
        options:
          - baseline
          - cutover-ready

permissions:
  contents: read

jobs:
  preflight:
    if: github.repository == 'KnightCodeSquareMatrix/RIIC-Web'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: deployment-preflight-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_APP_ROOT: ${{ vars.DEPLOY_APP_ROOT }}
      DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE }}
      DEPLOY_RUN_USER: ${{ vars.DEPLOY_RUN_USER || 'arkinfra' }}
      DEPLOY_INTERNAL_PORT: ${{ vars.DEPLOY_INTERNAL_PORT }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      PREFLIGHT_MODE: ${{ inputs.mode }}
      DEPLOY_APPROVED_SOLVER_SHA256: ${{ inputs.environment == 'development' && vars.DEPLOY_APPROVED_SOLVER_SHA256 || '' }}
      DEPLOY_EXPECTED_REPOSITORY: KnightCodeSquareMatrix/RIIC-Web
      DEPLOY_RELEASE_HELPER_CONTRACT: "6"

    steps:
      - name: Validate preflight configuration
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_USER"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$DEPLOY_SSH_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          test "$DEPLOY_SSH_USER" != "root"
          [[ "$DEPLOY_APP_ROOT" =~ ^/opt/arknights-infra(-[A-Za-z0-9._-]+)?$ ]]
          [[ "$DEPLOY_SERVICE" =~ ^arknights-infra(-[A-Za-z0-9_.@-]+)?$ ]]
          [[ "$DEPLOY_RUN_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          test "$DEPLOY_RUN_USER" != "root"
          [[ "$DEPLOY_INTERNAL_PORT" =~ ^[0-9]{2,5}$ ]]
          [[ "$PREFLIGHT_MODE" == "baseline" || "$PREFLIGHT_MODE" == "cutover-ready" ]]
          test "$DEPLOY_EXPECTED_REPOSITORY" = "KnightCodeSquareMatrix/RIIC-Web"
          if [[ "$PREFLIGHT_MODE" == "cutover-ready" && "$DEPLOY_ENVIRONMENT" == "development" ]]; then
            [[ "$DEPLOY_APPROVED_SOLVER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          fi

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Inspect deploy helper, solver, and disk
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )

          verify_helper() {
            local label="$1"
            local helper_path="$2"
            local expected_contract="$3"
            local metadata actual_contract artifact_sha256

            metadata="$(timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
              "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
              "test -f '$helper_path' && test ! -L '$helper_path' && stat -c '%U:%G:%a' -- '$helper_path'")"
            test "$metadata" = "root:root:755"
            actual_contract="$(timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
              "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
              "'$helper_path' --contract-version")"
            [[ "$actual_contract" =~ ^[1-9][0-9]*$ ]]
            if [[ "$PREFLIGHT_MODE" == "cutover-ready" ]]; then
              test "$actual_contract" = "$expected_contract"
            fi
            artifact_sha256="$(timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
              "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
              "sha256sum -- '$helper_path' | cut -d ' ' -f 1")"
            [[ "$artifact_sha256" =~ ^[0-9a-f]{64}$ ]]
            printf '%s helper contract=%s sha256=%s\n' "$label" "$actual_contract" "$artifact_sha256" \
              >> "$GITHUB_STEP_SUMMARY"
          }

          verify_helper deploy /usr/local/sbin/arknights-infra-deploy \
            "$DEPLOY_RELEASE_HELPER_CONTRACT"

          if [[ "$PREFLIGHT_MODE" == "cutover-ready" && "$DEPLOY_ENVIRONMENT" == "production" ]]; then
            test "$DEPLOY_APP_ROOT" = "/opt/arknights-infra"
            DEPLOY_APPROVED_SOLVER_SHA256="$(timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
              "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
              "set -eu
               test -f '$DEPLOY_APP_ROOT/shared/bin/infra-cli.sha256'
               test ! -L '$DEPLOY_APP_ROOT/shared/bin/infra-cli.sha256'
               cat '$DEPLOY_APP_ROOT/shared/bin/infra-cli.sha256'")"
            [[ "$DEPLOY_APPROVED_SOLVER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          fi

          timeout --kill-after=10s 60s ssh "${ssh_options[@]}" \
            "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
            bash -s -- "$DEPLOY_APP_ROOT" "$PREFLIGHT_MODE" "$DEPLOY_ENVIRONMENT" \
              "$DEPLOY_EXPECTED_REPOSITORY" "$DEPLOY_APPROVED_SOLVER_SHA256" <<'REMOTE'
          set -euo pipefail
          app_root="$1"
          preflight_mode="$2"
          deployment_environment="$3"
          expected_repository="$4"
          approved_solver_sha256="$5"
          cutover_ready=0
          if [[ "$preflight_mode" == "cutover-ready" ]]; then
            cutover_ready=1
          elif [[ "$preflight_mode" != "baseline" ]]; then
            exit 1
          fi

          test -d "$app_root"
          test ! -L "$app_root"

          if [[ "$cutover_ready" == "1" ]]; then
            sudo -n /usr/local/sbin/arknights-infra-deploy \
              --preflight "$deployment_environment" "$app_root" \
              "$expected_repository" "$approved_solver_sha256"
          else
            available_kib="$(df -Pk "$app_root" | awk 'NR == 2 { print $4 }')"
            [[ "$available_kib" =~ ^[0-9]+$ ]]
            (( available_kib >= 2097152 ))
            printf 'solver_source=not-inspected-root-only\n'
            printf 'available_kib=%s\n' "$available_kib"
          fi
          printf 'preflight_mode=%s\n' "$preflight_mode"
          REMOTE

          {
            echo
            echo "Preflight is read-only: no archive, release directory, symlink switch, or service restart was requested."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read-only incident diagnostics
        if: inputs.mode == 'baseline'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )

          timeout --kill-after=10s 90s ssh "${ssh_options[@]}" \
            "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
            bash -s -- "$DEPLOY_SERVICE" "$DEPLOY_RUN_USER" "$DEPLOY_INTERNAL_PORT" <<'REMOTE'
          set -euo pipefail
          service="$1"
          run_user="$2"
          internal_port="$3"
          [[ "$internal_port" =~ ^[0-9]{2,5}$ ]]
          [[ "$service" =~ ^arknights-infra(-[A-Za-z0-9_.@-]+)?$ ]]
          [[ "$run_user" =~ ^[A-Za-z0-9_-]+$ ]]

          echo '=== host resources ==='
          uptime
          free -m
          df -Pk /opt

          echo '=== application processes ==='
          ps -u "$run_user" -o pid=,ppid=,etimes=,rss=,comm= | sort -k5,5 -k1,1n
          while read -r pid; do
            [[ "$pid" =~ ^[0-9]+$ ]]
            printf 'pid=%s cgroup=' "$pid"
            awk -F: '$1 == "0" { print $3 }' "/proc/$pid/cgroup"
          done < <(ps -u "$run_user" -o pid=)

          echo '=== application units ==='
          mapfile -t units < <(
            systemctl list-unit-files --type=service --no-legend "${service}*.service" \
              | awk '{ print $1 }' \
              | grep -E '^arknights-infra[-A-Za-z0-9_.@]*\.service$' \
              | grep -v '@\.service$' \
              | sort -u
          )
          ((${#units[@]} > 0))
          for unit in "${units[@]}"; do
            systemctl show --no-pager "$unit" \
              --property=Id,ActiveState,SubState,Result,MainPID,NRestarts,MemoryCurrent,MemoryPeak,TasksCurrent,TasksMax,CPUUsageNSec,ExecMainStartTimestamp,ExecMainExitTimestamp
          done

          echo '=== recent application journals ==='
          for unit in "${units[@]}"; do
            echo "--- $unit ---"
            journalctl --no-pager -o short-iso --since '90 minutes ago' -n 300 -u "$unit" || true
          done

          echo '=== recent kernel OOM evidence ==='
          journalctl -k --no-pager -o short-iso --since '90 minutes ago' \
            | grep -Ei 'out of memory|oom-kill|killed process' || true

          echo '=== internal health response (including non-2xx) ==='
          curl --silent --show-error --max-time 15 --write-out '\nhttp_status=%{http_code}\n' \
            "http://127.0.0.1:$internal_port/api/health" || true

          echo '=== scoped startup errors using existing sudo permissions ==='
          for unit in "$service.service" "$service-worker.service"; do
            sudo -n journalctl --no-pager -o cat --since '2026-10-13 14:32:00 UTC' \
              --until '2026-10-13 14:35:00 UTC' -n 200 -u "$unit" \
              | grep -Ei 'error|failed|cannot|not found|missing|ready|listening|exit|worker|heartbeat' \
              | sed -E 's#postgres(ql)?://[^[:space:]]+#[REDACTED_DATABASE_URL]#g' || true
          done
          REMOTE

      - name: Remove SSH credentials from the runner
        if: always()
        shell: bash
        run: rm -f -- "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
