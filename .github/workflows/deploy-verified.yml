name: Deploy previously verified release

on:
  workflow_dispatch:
    inputs:
      application:
        description: Retry only this application's deployment
        required: true
        type: choice
        options: [arknights, endfield]
      verified_run_id:
        description: Post-merge release run whose required quality checks passed for this exact commit
        required: true
        type: string
      expected_sha:
        description: Exact current main/develop commit to deploy
        required: true
        type: string

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: post-merge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'KnightCodeSquareMatrix/RIIC-Web' &&
      (github.ref_name == 'main' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact_name: ${{ steps.source.outputs.artifact_name }}
      artifact_run_id: ${{ steps.source.outputs.artifact_run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Verify source workflow, checks, commit and artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
          DEPLOY_APPLICATION: ${{ inputs.application }}
        run: node scripts/release-provenance.mjs verify

  deploy:
    needs: verify
    uses: ./.github/workflows/deploy.yml
    with:
      application: ${{ inputs.application }}
      artifact_name: ${{ needs.verify.outputs.artifact_name }}
      artifact_run_id: ${{ needs.verify.outputs.artifact_run_id }}
      deployment_authorized: true
      deploy_required: true
    secrets: inherit
